[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "atem-ai-vision-mixer"
version = "0.1.0"
description = "An offline-first AI camera switcher for live video production"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["pydantic>=2"]

[project.optional-dependencies]
dev = ["pytest", "pytest-cov", "ruff"]

[tool.hatch.build.targets.wheel]
packages = ["atem_ai_vision_mixer"]

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
extend-select = ["I"]
