[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "atem-ai-vision-mixer"
version = "0.1.0"
description = "An offline-first AI camera switcher for live video production"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["pydantic>=2"]

[project.optional-dependencies]
# Pydantic stays in the base dependencies so a plain installation remains usable.
core = ["pydantic>=2"]
perception = [
  "av",
  "mediapipe",
  "onnxruntime",
  "opencv-contrib-python",
]
llm = ["anthropic[bedrock]", "ollama"]
dev = ["coverage", "diff-cover", "pytest", "pytest-cov", "ruff"]
capture = ["av"]

[tool.hatch.build.targets.wheel]
packages = ["atem_ai_vision_mixer"]

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
extend-select = ["I"]

[tool.coverage.run]
branch = true

[tool.coverage.report]
fail_under = 85
show_missing = true
exclude_also = [
  "if TYPE_CHECKING:",
  "raise NotImplementedError",
  "if __name__ == .__main__.:",
]
