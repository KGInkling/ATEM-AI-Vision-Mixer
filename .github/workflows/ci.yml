name: ci

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11.9"
          cache: pip
          cache-dependency-path: .github/workflows/ci.yml

      - name: Install lint tools
        run: python -m pip install ruff

      - name: Check lint rules
        run: ruff check .

      - name: Check formatting
        run: ruff format --check .

  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out the repository with full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11.9"
          cache: pip
          cache-dependency-path: .github/workflows/ci.yml

      - name: Install test tools
        run: |
          python -m pip install coverage diff-cover pytest pytest-cov
          if [ -f pyproject.toml ]; then
            python -m pip install --editable .
          fi

      - name: Run the full test suite with coverage
        run: |
          if [ ! -d tests ]; then
            if [ -d atem_ai_vision_mixer ]; then
              echo "Application code exists, but the test suite is missing."
              exit 1
            fi

            echo "::notice::No application code or tests exist yet; the bootstrap test job has nothing to run."
            exit 0
          fi

          python -m pytest \
            --cov=atem_ai_vision_mixer \
            --cov-report=term-missing \
            --cov-report=xml

      - name: Enforce per-file coverage thresholds
        run: |
          while IFS=: read -r path threshold; do
            if [ -z "$path" ]; then
              continue
            fi

            if [ ! -f "$path" ]; then
              if git cat-file -e "origin/main:$path" 2>/dev/null; then
                echo "::error file=$path::A file with a coverage threshold was removed."
                exit 1
              fi

              echo "::notice file=$path::The $threshold% coverage gate is pending until this file is added."
              continue
            fi

            coverage report \
              --include="$path" \
              --fail-under="$threshold"
          done < .coverage-thresholds

      - name: Enforce changed-line coverage
        run: |
          set +e
          diff-cover coverage.xml \
            --compare-branch=origin/main \
            --fail-under=90 \
            --format markdown:diff-cover.md
          diff_cover_exit_code=$?
          set -e

          cat diff-cover.md >> "$GITHUB_STEP_SUMMARY"
          exit "$diff_cover_exit_code"

  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11.9"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install the build frontend
        run: python -m pip install build

      - name: Build the source and wheel distributions
        run: python -m build

      - name: Install and import the wheel outside the checkout
        shell: bash
        run: |
          python -m venv "$RUNNER_TEMP/wheel-venv"
          "$RUNNER_TEMP/wheel-venv/bin/python" -m pip install --no-deps dist/*.whl
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/wheel-venv/bin/python" -c \
            'from pathlib import Path; import atem_ai_vision_mixer.capture.file_source as file_source, sys; path = Path(file_source.__file__).resolve(); print(path); assert path.is_relative_to(Path(sys.prefix).resolve())'

  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Review runtime dependency changes
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: moderate
          fail-on-scopes: runtime

  integration:
    runs-on: macos-26

    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11.9"
          cache: pip
          cache-dependency-path: .github/workflows/ci.yml

      - name: Install perception and test dependencies
        run: |
          python -m pip install --editable ".[perception,dev]"
          python -c "import av, numpy; print(f'PyAV {av.__version__}; NumPy {numpy.__version__}')"

      - name: Run the full macOS integration suite
        run: |
          if [ ! -d tests ]; then
            if [ -d atem_ai_vision_mixer ]; then
              echo "Application code exists, but the test suite is missing."
              exit 1
            fi

            echo "::notice::No application code or tests exist yet; the bootstrap integration job has nothing to run."
            exit 0
          fi

          python -m pytest -rs
